name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install GJS test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs python3-dbus python3-gi
      - name: Check syntax
        run: make PYTHON=python check
