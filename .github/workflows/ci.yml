name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-helper:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the portable data helper
        run: python codex-quota/tests/test_codex_dashboard_data.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-dbus python3-gi shellcheck
      - name: Run checks
        run: make check
